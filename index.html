<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defence Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EA; --ink:#18251F; --muted:#5B6A62; --line:#C9D1CA;
  --felt:#2C5446; --felt-ink:#E9EFEA; --felt-muted:#A9C1B6;
  --card:#FBFAF5; --card-ink:#1A1D1B; --red:#B3261E; --brass:#9C7A33;
  --good:#2E6B3F; --bad:#9A3A2C; --panel:#F7F8F4;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101714; --ink:#E4EAE5; --muted:#93A29A; --line:#2A3832;
    --felt:#1C3A31; --felt-ink:#E4EAE5; --felt-muted:#8FB0A2;
    --card:#E8E5DB; --card-ink:#1A1D1B; --red:#A3271D; --brass:#C9A55A;
    --good:#7FC08F; --bad:#E08A78; --panel:#17201C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101714; --ink:#E4EAE5; --muted:#93A29A; --line:#2A3832;
  --felt:#1C3A31; --felt-ink:#E4EAE5; --felt-muted:#8FB0A2;
  --card:#E8E5DB; --card-ink:#1A1D1B; --red:#A3271D; --brass:#C9A55A;
  --good:#7FC08F; --bad:#E08A78; --panel:#17201C; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 "Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0 14px;border-bottom:1px solid var(--line)}
h1{font:700 26px/1.1 Alegreya,Georgia,serif;margin:0;letter-spacing:.2px}
.meta{color:var(--muted);font-size:15px;text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:12px 0 4px;font-size:15px;color:var(--muted)}
.toolbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer;padding:4px 0}
.contract{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin:16px 0 8px}
.contract .c{font:700 30px/1 Alegreya,Georgia,serif}
.contract .by{color:var(--muted)}
.theme{font:500 19px/1.3 Alegreya,Georgia,serif;color:var(--brass);margin:4px 0 0}
table.auction{border-collapse:collapse;font-size:15px;margin:6px 0 14px}
table.auction th{font-weight:500;color:var(--muted);text-align:left;padding:2px 18px 2px 0}
table.auction td{padding:2px 18px 2px 0;font-variant-numeric:tabular-nums}
.felt{background:var(--felt);color:var(--felt-ink);border-radius:14px;padding:14px;margin:6px 0 16px}
.seat{margin:0 0 12px}
.seat:last-child{margin-bottom:0}
.seatname{font-size:14px;color:var(--felt-muted);margin:0 0 6px}
.seatname b{color:var(--felt-ink);font-weight:700}
.hand{background:var(--card);color:var(--card-ink);border-radius:10px;padding:8px 10px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.row{display:flex;align-items:center;gap:6px;min-height:40px;flex-wrap:wrap}
.row+.row{border-top:1px solid rgba(0,0,0,.08)}
.sym{width:28px;font-size:24px;line-height:1;text-align:center;flex:none}
.red{color:var(--red)}
.rk{font:700 20px/1 "Alegreya Sans",sans-serif;padding:6px 4px;min-width:26px;text-align:center}
.void{color:#8a8f8c;font-size:15px}
button.rk{background:transparent;border:1.5px solid rgba(0,0,0,.18);border-radius:8px;min-width:40px;min-height:40px;color:inherit;cursor:pointer;padding:6px 8px}
button.rk:hover{border-color:var(--card-ink)}
button.rk:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button.rk:disabled{opacity:.35;cursor:default;border-style:dashed}
button.rk.chosen{background:var(--card-ink);color:var(--card)}
button.rk.works{box-shadow:inset 0 -3px 0 var(--good)}
.hidden-hand{border:1.5px dashed var(--felt-muted);border-radius:10px;padding:10px;color:var(--felt-muted);font-size:15px}
.tricks{font-size:15px;color:var(--felt-ink);margin:0 0 12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.15);border-bottom:1px solid rgba(255,255,255,.15)}
.tricks ol{margin:0;padding-left:20px}
.tricks li{margin:2px 0}
.tricks .won{color:var(--felt-muted)}
.cardtxt{white-space:nowrap}
.felt .cardtxt .red{color:#F4A39A}
.prompt{font:500 19px/1.35 Alegreya,Georgia,serif;margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.two{grid-template-columns:1fr 1fr}}
.feedback{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 16px}
.verdict{font:700 22px/1.2 Alegreya,Georgia,serif;margin:0 0 4px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.result{margin:0 0 12px;color:var(--muted)}
.principle{font:500 18px/1.45 Alegreya,Georgia,serif;margin:0 0 10px}
.feedback p{margin:0 0 10px;max-width:68ch}
.feedback .small{font-size:14px;color:var(--muted)}
.feedback .red{color:var(--red)}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 16px/1 "Alegreya Sans",sans-serif;border-radius:10px;padding:13px 18px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.deal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 12px}
.deal .hand{padding:6px 8px}
.deal .row{min-height:28px}
.deal .rk{font-size:16px;padding:2px 2px;min-width:18px}
.deal .sym{font-size:18px;width:22px}
.dealtitle{font-size:14px;color:var(--muted);margin:0 0 4px}
.intro{color:var(--muted);font-size:15px;margin:10px 0 0;max-width:68ch}
@media (prefers-reduced-motion:no-preference){.feedback{animation:rise .25s ease-out}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

.vbtn{display:inline-flex;align-items:center;gap:10px;font:700 16px/1 "Alegreya Sans",sans-serif;border-radius:10px;padding:12px 16px;min-height:44px;border:1.5px solid var(--brass);background:transparent;color:var(--ink);cursor:pointer;margin:0 0 6px}
.vbtn .tri{width:0;height:0;border-left:12px solid var(--brass);border-top:7px solid transparent;border-bottom:7px solid transparent}
.vbtn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.vhint{font-size:14px;color:var(--muted);margin:0 0 12px}
.modal{position:fixed;inset:0;background:rgba(10,16,13,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px));z-index:50}
.player{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:16px;padding:14px}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px}
.ptop b{font:700 18px/1.2 Alegreya,Georgia,serif}
.stage{background:var(--felt);color:var(--felt-ink);border-radius:12px;min-height:300px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.stage .red{color:var(--red)}
.vtitle .vkick{font-size:15px;color:var(--felt-muted);letter-spacing:.5px;margin-bottom:6px}
.vtitle .vhead{font:700 32px/1.15 Alegreya,Georgia,serif}
.vprin{font:500 italic 24px/1.35 Alegreya,Georgia,serif;color:#F2EBDA;max-width:30ch}
.vhand{background:var(--card);color:var(--card-ink);border-radius:10px;padding:10px 16px;min-width:200px;text-align:left}
.vlabel{font-size:14px;color:#5B6A62;margin-bottom:2px}
.vrow{font:700 22px/1.5 "Alegreya Sans",sans-serif;padding:0 8px;border-radius:6px}
.vrow.hl{background:#F1E3B8}
.vnote{font-size:18px;color:#F2EBDA}
.vpair{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.vflow{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;max-width:420px}
.vbox{background:var(--card);color:var(--card-ink);border-radius:10px;padding:8px 14px;font:700 18px/1.3 "Alegreya Sans",sans-serif;width:100%}
.vbox.hl{background:#F1E3B8;outline:3px solid var(--brass)}
.varrow{color:#E2C37A;font-size:20px;line-height:1}
.vtable{border-collapse:collapse;font-size:18px;color:var(--felt-ink)}
.vtable th{color:var(--felt-muted);font-weight:500;padding:4px 14px}
.vtable td{padding:4px 14px}
.vtable tr.hl td{color:#E2C37A;font-weight:700}
.caption{font-size:17px;line-height:1.45;min-height:3em;margin:12px 2px 8px}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--brass)}
.pctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.pctl .btn{padding:11px 14px}
.pnote{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.stage>*{animation:rise .3s ease-out}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Defence Drills</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="toolbar">
  <label><input type="checkbox" id="showTheme"> Show the theme before answering</label>
  <button class="linkbtn" id="shuffle">Shuffle problems</button>
  <button class="linkbtn" id="reset">Clear my scores</button>
</div>
<p class="intro">You see dummy and your own hand. Pick the card you would play. Each problem was checked with a double-dummy solver, which assumes both sides play perfectly with all cards visible. Auctions are illustrative.</p>
<main id="app"></main>

, "S": ["SK", "S8", "S4", "H7", "H3", "DA", "D9", "D3", "D2", "CQ", "C9", "C3", "C2"], "W": ["SA", "SJ", "ST", "S9", "HK", "HJ", "D7", "D5", "CK", "CT", "C8", "C7", "C5"]}, "remaining": {"N": ["SQ", "S7", "S5", "HA", "HQ", "HT", "H4", "DK", "DQ", "DJ", "DT", "C6"], "E": ["S6", "S3", "S2", "H9", "H8", "H6", "H5", "H2", "D8", "D6", "D4", "CJ"], "S": ["SK", "S8", "S4", "H7", "H3", "DA", "D9", "D3", "D2", "CQ", "C9", "C3"], "W": ["SA", "SJ", "ST", "S9", "HK", "HJ", "D7", "D5", "CK", "CT", "C8", "C5"]}, "history": [{"leader": "W", "cards": ["C7", "C4", "CA", "C2"], "winner": "E"}], "dd": {"S6": 4, "S3": 4, "S2": 4, "H9": 4, "H8": 4, "H6": 4, "H5": 4, "H2": 4, "D8": 4, "D6": 4, "D4": 4, "CJ": 5}, "title": "Don’t catch partner in the middle", "contract": "3NT", "dealer": "N", "calls": ["1♦", "Pass", "1NT", "Pass", "2NT", "Pass", "3NT", "Pass", "Pass", "Pass"], "principle": "Avoid leading a suit where dummy, playing last, holds high cards over partner.", "why": "Dummy’s ♥AQ10 plays after partner. Lead a heart and partner is caught in the middle: play the king and dummy’s ace takes it, play low and dummy wins cheaply. Return partner’s suit instead. The ♣7 was fourth best, so partner has a long club suit; your ♣J helps set it up while partner still has an entry.", "notes": {"H": "Your long hearts are tempting, but dummy’s ♥AQ10 sits over partner’s hearts.", "S": "A spade is passive but too slow: declarer keeps control and the clubs never get established.", "D": "Diamonds are dummy’s strong suit; leading them only helps declarer."}}, {"id": "holdup", "seat": "E", "target": 5, "defSoFar": 0, "trump": "N", "original": {"N": ["S7", "S5", "S3", "H8", "H6", "H4", "DK", "DQ", "DJ", "DT", "D9", "C7", "C2"], "E": ["S9", "S2", "HJ", "HT", "H9", "H2", "DA", "D7", "D2", "CJ", "CT", "C8", "C5"], "S": ["SA", "SK", "S4", "HA", "HK", "H5", "D6", "D5", "CA", "CQ", "C9", "C4", "C3"], "W": ["SQ", "SJ", "ST", "S8", "S6", "HQ", "H7", "H3", "D8", "D4", "D3", "CK", "C6"]}, "remaining": {"N": ["S7", const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let answers=store.get('dd-answers',{});
let order=store.get('dd-order',SCENARIOS.map(s=>s.id)).filter(id=>SCENARIOS.some(s=>s.id===id));
if(order.length!==SCENARIOS.length) order=SCENARIOS.map(s=>s.id);
let idx=Math.min(store.get('dd-idx',0),order.length-1);
let showTheme=store.get('dd-theme',false);
const $=id=>document.getElementById(id);
$('showTheme').checked=showTheme;
$('showTheme').onchange=e=>{showTheme=e.target.checked;store.set('dd-theme',showTheme);render()};
$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;save();render()};
$('reset').onclick=()=>{answers={};store.set('dd-answers',answers);render()};
function save(){store.set('dd-order',order);store.set('dd-idx',idx);store.set('dd-answers',answers)}
function cardHTML(c){const s=c[0];return `<span class="cardtxt"><span class="${isRed(s)?'red':''}">${SYM[s]}</span>${RK(c[1])}</span>`}
function partnerOf(s){return {E:'W',W:'E',N:'S',S:'N'}[s]}
function handHTML(cards,opts={}){
  let h='';
  for(const s of 'SHDC'){
    const cs=cards.filter(c=>c[0]===s);
    h+=`<div class="row"><span class="sym ${isRed(s)?'red':''}" aria-label="${{S:'Spades',H:'Hearts',D:'Diamonds',C:'Clubs'}[s]}">${SYM[s]}</span>`;
    if(!cs.length) h+=`<span class="void">void</span>`;
    for(const c of cs){
      if(opts.buttons){
        const legal=opts.legal.includes(c);
        const cls=['rk',opts.chosen===c?'chosen':'',opts.answered&&opts.works.includes(c)?'works':''].join(' ');
        h+=`<button class="${cls} ${isRed(s)?'red':''}" data-card="${c}" ${(!legal||opts.answered)?'disabled':''} aria-label="${RK(c[1])} of ${{S:'spades',H:'hearts',D:'diamonds',C:'clubs'}[s]}">${RK(c[1])}</button>`;
      } else h+=`<span class="rk">${RK(c[1])}</span>`;
    }
    h+='</div>';
  }
  return `<div class="hand">${h}</div>`;
}
function auctionHTML(sc){
  const cols=['W','N','E','S'];
  const start=cols.indexOf(sc.dealer);
  const cells=Array(start).fill('');
  sc.calls.forEach(c=>cells.push(c));
  // collapse trailing passes into "All pass"
  let n=cells.length; let k=0; while(k<3&&cells[n-1-k]==='Pass')k++;
  if(k===3){cells.splice(n-3,3,'All pass')}
  let rows='';
  for(let i=0;i<cells.length;i+=4){rows+='<tr>'+cols.map((_,j)=>`<td>${fmtCall(cells[i+j]||'')}</td>`).join('')+'</tr>'}
  return `<table class="auction"><thead><tr>${cols.map(c=>`<th>${SEATS[c]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}
function fmtCall(c){return c.replace(/([♥♦])/g,'<span class="red">$1</span>')}
function legalCards(sc){
  const hand=sc.remaining[sc.seat]; const last=sc.history[sc.history.length-1];
  if(last.winner===null){const led=last.cards[0][0];const f=hand.filter(c=>c[0]===led);return f.length?f:hand}
  return hand;
}
function trickNo(sc){return sc.history.filter(t=>t.winner!==null).length+1}
function promptText(sc){
  const last=sc.history[sc.history.length-1];
  const you=SEATS[sc.seat];
  if(last.winner===null) return `You are ${you}. Which card do you play to trick ${trickNo(sc)}?`;
  return `You are ${you}, on lead to trick ${trickNo(sc)}. What do you lead?`;
}
function historyHTML(sc){
  let items='';
  sc.history.forEach((t,i)=>{
    let seat=ORDER.indexOf(t.leader); let parts=[];
    t.cards.forEach((c,k)=>{parts.push(`${SEATS[ORDER[(seat+k)%4]]} ${cardHTML(c)}`)});
    const tail=t.winner?` <span class="won">won by ${SEATS[t.winner]}</span>`:` <span class="won">${SEATS[sc.seat]} to play</span>`;
    items+=`<li>${parts.join(', ')}.${tail}</li>`;
  });
  return `<div class="tricks"><ol>${items}</ol></div>`;
}
function resultText(sc,card){
  const d=sc.dd[card]; const declTricks=13-d; const need=13-sc.target+1;
  if(d>=sc.target){const down=d-sc.target+1;return `With ${cardHTML(card)} the defence takes ${d} tricks: ${sc.contract} goes down ${down}.`}
  return `With ${cardHTML(card)} the defence takes only ${d} tricks: declarer makes ${declTricks} and ${sc.contract} ${declTricks===need?'just makes':'makes with '+(declTricks-need)+' over'}.`;
}
function render(){
  const sc=SCENARIOS.find(s=>s.id===order[idx]);
  const ans=answers[sc.id];
  const done=Object.keys(answers).length, right=Object.values(answers).filter(a=>a.ok).length;
  $('meta').innerHTML=`Problem ${idx+1} of ${order.length}<br>${done?`${right} of ${done} right`:'No answers yet'}`;
  const legal=legalCards(sc);
  const works=legal.filter(c=>sc.dd[c]>=sc.target);
  const dummy='N', decl='S', partner=partnerOf(sc.seat);
  let h=`<div class="contract"><span class="c">${fmtCall(sc.contract)}</span><span class="by">by South</span></div>`;
  if(showTheme||ans) h+=`<p class="theme">${sc.title}</p>`;
  h+=auctionHTML(sc);
  h+=`<button class="vbtn" id="vbtn"><span class="tri" aria-hidden="true"></span>Watch the concept</button>`;
  h+=(!ans&&!showTheme)?`<p class="vhint">Watching first reveals this problem’s theme.</p>`:`<p class="vhint">A short narrated explanation of the idea behind this problem.</p>`;
  h+=`<section class="felt" aria-label="Table">`;
  h+=`<div class="seat"><p class="seatname"><b>North</b>, dummy</p>${handHTML(sc.remaining[dummy])}</div>`;
  h+=historyHTML(sc);
  if(ans){
    h+=`<div class="two" style="margin-bottom:12px"><div><p class="seatname"><b>${SEATS[partner]}</b>, partner</p>${handHTML(sc.remaining[partner])}</div><div><p class="seatname"><b>South</b>, declarer</p>${handHTML(sc.remaining[decl])}</div></div>`;
  } else {
    h+=`<div class="two" style="margin-bottom:12px"><div class="hidden-hand">${SEATS[partner]} (partner): hidden until you answer</div><div class="hidden-hand">South (declarer): hidden until you answer</div></div>`;
  }
  h+=`<div class="seat"><p class="prompt">${promptText(sc)}</p>${handHTML(sc.remaining[sc.seat],{buttons:true,legal,chosen:ans&&ans.card,answered:!!ans,works})}</div>`;
  h+=`</section>`;
  if(ans){
    const card=ans.card, ok=sc.dd[card]>=sc.target;
    const suitNote=!ok&&sc.notes[card[0]]?`<p>${fmtCall(sc.notes[card[0]])}</p>`:'';
    const rightNote=ok&&sc.right&&sc.right[card]?`<p>${fmtCall(sc.right[card])}</p>`:'';
    h+=`<section class="feedback" aria-live="polite">
      <p class="verdict ${ok?'ok':'no'}">${ok?'Right.':'Not this time.'}</p>
      <p class="result">${resultText(sc,card)}</p>
      <p class="principle">${fmtCall(sc.principle)}</p>
      <p>${fmtCall(sc.why)}</p>${suitNote}${rightNote}
      <p class="small">Cards that defeat the contract: ${works.map(cardHTML).join(' ')}. They are underlined in your hand above.</p>
      <p class="dealtitle">The full deal before trick 1</p>
      <div class="deal">${['N','E','S','W'].map(s=>`<div><p class="dealtitle">${SEATS[s]}${s==='N'?', dummy':s==='S'?', declarer':s===sc.seat?', you':', partner'}</p>${handHTML(sc.original[s])}</div>`).join('')}</div>
      <div class="nav">
        ${idx<order.length-1?'<button class="btn" id="next">Next problem</button>':'<button class="btn" id="restart">Start again</button>'}
        <button class="btn ghost" id="retry">Try this one again</button>
      </div></section>`;
  } else {
    h+=`<div class="nav">${idx>0?'<button class="btn ghost" id="prev">Previous</button>':''}${idx<order.length-1?'<button class="btn ghost" id="skip">Skip</button>':''}</div>`;
  }
  $('app').innerHTML=h;
  document.querySelectorAll('button.rk[data-card]').forEach(b=>b.onclick=()=>{answers[sc.id]={card:b.dataset.card,ok:sc.dd[b.dataset.card]>=sc.target};save();render();const f=document.querySelector('.feedback');if(f)f.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
  const go=(d)=>{idx=Math.max(0,Math.min(order.length-1,idx+d));save();render();window.scrollTo(0,0)};
  if($('vbtn'))$('vbtn').onclick=()=>openVideo(sc.id);
  if($('next'))$('next').onclick=()=>go(1);
  if($('skip'))$('skip').onclick=()=>go(1);
  if($('prev'))$('prev').onclick=()=>go(-1);
  if($('retry'))$('retry').onclick=()=>{delete answers[sc.id];save();render()};
  if($('restart'))$('restart').onclick=()=>{answers={};idx=0;save();render();window.scrollTo(0,0)};
}

const canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if(canSpeak){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function pickVoice(){
  const en=voices.filter(v=>/^en/i.test(v.lang));
  const pref=['Samantha','Daniel','Karen','Google US English','Google UK English Female','Microsoft Aria','Microsoft Jenny'];
  for(const p of pref){const v=en.find(v=>v.name.includes(p));if(v)return v}
  return en.find(v=>v.default)||en[0]||null;
}
const P={segs:null,i:0,playing:false,run:0,timer:null,sound:true,id:null};
function stopAll(){P.run++;clearTimeout(P.timer);if(canSpeak){try{speechSynthesis.cancel()}catch(e){}}}
function showSeg(k){
  P.i=k;const s=P.segs[k];
  const st=document.getElementById('stage'),cap=document.getElementById('caption'),dots=document.getElementById('dots');
  if(!st)return;
  st.innerHTML=s.html;cap.textContent=s.say;
  dots.innerHTML=P.segs.map((_,j)=>`<span class="${j===k?'on':''}"></span>`).join('');
  updCtl();
}
function updCtl(){
  const b=document.getElementById('pplay');if(!b)return;
  const atEnd=!P.playing&&P.i===P.segs.length-1&&P.ended;
  b.textContent=P.playing?'Pause':(atEnd?'Replay':(P.started?'Resume':'Play'));
  document.getElementById('psound').textContent=P.sound&&canSpeak?'Sound: on':'Sound: off';
}
function playFrom(k){
  stopAll();const run=P.run;P.playing=true;P.started=true;P.ended=false;
  const finish=()=>{if(run!==P.run)return;P.playing=false;P.ended=true;updCtl()};
  if(P.sound&&canSpeak){
    const v=pickVoice();
    for(let j=k;j<P.segs.length;j++){
      const u=new SpeechSynthesisUtterance(P.segs[j].say);
      if(v)u.voice=v; u.lang=v?v.lang:'en-US'; u.rate=0.95;
      u.onstart=()=>{if(run===P.run)showSeg(j)};
      if(j===P.segs.length-1){u.onend=finish}
      u.onerror=()=>{};
      speechSynthesis.speak(u);
    }
    showSeg(k);
  } else {
    const step=(j)=>{if(run!==P.run)return;showSeg(j);
      const ms=Math.max(2500,P.segs[j].say.split(/\s+/).length*400);
      P.timer=setTimeout(()=>{if(j<P.segs.length-1)step(j+1);else finish()},ms)};
    step(k);
  }
  updCtl();
}
function pause(){stopAll();P.playing=false;updCtl()}
function openVideo(id){
  P.segs=VIDEOS[id];P.id=id;P.i=0;P.started=false;P.ended=false;
  const sc=SCENARIOS.find(s=>s.id===id);
  const m=document.createElement('div');m.className='modal';m.id='vmodal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Concept video');
  m.innerHTML=`<div class="player"><div class="ptop"><b>${sc.title}</b><button class="btn ghost" id="pclose">Close</button></div>
  <div class="stage" id="stage"></div><p class="caption" id="caption" aria-live="polite"></p><div class="dots" id="dots"></div>
  <div class="pctl"><button class="btn ghost" id="pprev" aria-label="Previous">‹ Back</button><button class="btn" id="pplay">Play</button><button class="btn ghost" id="pnext" aria-label="Next">Next ›</button><button class="btn ghost" id="psound">Sound: on</button></div>
  <p class="pnote">${canSpeak?'Narration uses your device’s built-in voice. Check your phone isn’t on silent.':'This browser has no built-in voice, so the captions play on their own.'}</p></div>`;
  document.body.appendChild(m);
  const close=()=>{stopAll();P.playing=false;m.remove();document.removeEventListener('keydown',esc);const b=document.getElementById('vbtn');if(b)b.focus()};
  const esc=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',esc);
  m.addEventListener('click',e=>{if(e.target===m)close()});
  document.getElementById('pclose').onclick=close;
  document.getElementById('pplay').onclick=()=>{if(P.playing)pause();else if(P.ended)playFrom(0);else playFrom(P.i)};
  document.getElementById('pprev').onclick=()=>{const k=Math.max(0,P.i-1);P.ended=false;if(P.playing)playFrom(k);else showSeg(k)};
  document.getElementById('pnext').onclick=()=>{const k=Math.min(P.segs.length-1,P.i+1);P.ended=false;if(P.playing)playFrom(k);else showSeg(k)};
  document.getElementById('psound').onclick=()=>{P.sound=!P.sound;store.set('dd-sound',P.sound);if(P.playing)playFrom(P.i);else updCtl()};
  P.sound=store.get('dd-sound',true);
  showSeg(0);playFrom(0);
  document.getElementById('pplay').focus();
}
render();
</script>
